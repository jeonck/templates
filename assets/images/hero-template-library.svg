<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420"
     role="img" aria-label="A document template shown as a window: a title, two lines of text, Rendered and Markdown tabs, and a filled-in table"
     style="max-width:100%;height:auto">
  <defs>
    <linearGradient id="tl-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0066ff"/>
      <stop offset="1" stop-color="#35d0c0"/>
    </linearGradient>
    <filter id="tl-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1224" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- window -->
  <g filter="url(#tl-shadow)">
    <rect x="8" y="8" width="544" height="404" rx="18" fill="#0c1120" stroke="#223052" stroke-width="1"/>
  </g>

  <!-- title bar -->
  <g>
    <circle cx="38" cy="42" r="5.5" fill="#e05561"/>
    <circle cx="58" cy="42" r="5.5" fill="#e0a83f"/>
    <circle cx="78" cy="42" r="5.5" fill="#3fb96a"/>
    <rect x="106" y="35" width="168" height="13" rx="6.5" fill="#1a2540"/>
    <line x1="8" y1="66" x2="552" y2="66" stroke="#1b2540" stroke-width="1"/>
  </g>

  <!-- document title + lead-in -->
  <rect x="40" y="92" width="196" height="15" rx="7.5" fill="url(#tl-accent)"/>
  <rect x="40" y="124" width="330" height="9" rx="4.5" fill="#2a3550"/>
  <rect x="40" y="142" width="256" height="9" rx="4.5" fill="#232d46"/>

  <!-- Rendered / Markdown tabs -->
  <g>
    <rect x="40" y="176" width="78" height="10" rx="5" fill="#4d80d6"/>
    <rect x="40" y="196" width="78" height="2.5" rx="1.25" fill="#0066ff"/>
    <rect x="132" y="176" width="86" height="10" rx="5" fill="#2a3550"/>
    <line x1="40" y1="197.2" x2="520" y2="197.2" stroke="#1b2540" stroke-width="1"/>
  </g>

  <!-- table: header row -->
  <g>
    <rect x="40"  y="220" width="86"  height="10" rx="5" fill="#5a6a8a"/>
    <rect x="168" y="220" width="104" height="10" rx="5" fill="#5a6a8a"/>
    <rect x="312" y="220" width="72"  height="10" rx="5" fill="#5a6a8a"/>
    <rect x="424" y="220" width="60"  height="10" rx="5" fill="#5a6a8a"/>
    <line x1="40" y1="244" x2="520" y2="244" stroke="#2b3550" stroke-width="1"/>
  </g>

  <!-- table: body rows -->
  <g fill="#33405c">
    <rect x="40"  y="262" width="52"  height="9" rx="4.5"/>
    <rect x="168" y="262" width="126" height="9" rx="4.5"/>
    <rect x="312" y="262" width="56"  height="9" rx="4.5"/>
    <rect x="424" y="262" width="76"  height="9" rx="4.5"/>

    <rect x="40"  y="296" width="52"  height="9" rx="4.5"/>
    <rect x="168" y="296" width="98"  height="9" rx="4.5"/>
    <rect x="312" y="296" width="70"  height="9" rx="4.5"/>
    <rect x="424" y="296" width="58"  height="9" rx="4.5"/>

    <rect x="40"  y="330" width="52"  height="9" rx="4.5"/>
    <rect x="168" y="330" width="140" height="9" rx="4.5"/>
    <rect x="312" y="330" width="48"  height="9" rx="4.5"/>
    <rect x="424" y="330" width="68"  height="9" rx="4.5"/>
  </g>
  <g stroke="#1b2540" stroke-width="1">
    <line x1="40" y1="280" x2="520" y2="280"/>
    <line x1="40" y1="314" x2="520" y2="314"/>
    <line x1="40" y1="348" x2="520" y2="348"/>
  </g>

  <!-- closing line -->
  <rect x="40" y="370" width="212" height="9" rx="4.5" fill="#232d46"/>
</svg>
